<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library | Person</title>
</head>
<body>

<form th:method="PATCH" th:object="${person}" th:action="@{/people/{id}/edit (id=${person.getPersonId()})}">
    <label for="name">Введите новое имя: </label>
    <input type="text" th:field="*{name}" id="name"/>
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>

    <label for="year">Введите новую дату рождения: </label>
    <input type="number" th:field="*{year}" id="year"/>
    <div style="color: red" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">Year error</div>

    <input type="submit" value="Подтвердить">
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library | Person</title>
</head>
<body>

<div>
    <a th:text="'Имя: ' + ${person.getName()} + ', Год рождения: ' + ${person.getYear()}"></a>
</div>

<div th:if="${books.isEmpty()}">
    <a>Читатель не взял ни одной книги</a>
</div>

<div th:if="${!books.isEmpty()}">
    <a>Книги: </a>
    <div th:each="book : ${books}">
        <a th:text="'Название книги: ' + ${book.getName()} + ', Автор книги: ' + ${book.getAuthor()} + ', Год: ' + ${book.getYear()}"></a>
    </div>
</div>



<div>
    <form th:action="@{/people/{id}/edit (id=${person.getPersonId()})}">
        <input type="submit" value="Изменить читателя">
    </form>
</div>


<div>
    <form th:method="DELETE" th:action="@{/people/{id}/delete (id=${person.getPersonId()})}">
        <input type="submit" value="Удалить читателя">
    </form>
</div>

</body>
</html>
